<!DOCTYPE html>
<!--
  KaiBoard 自定义 404 页（与 public/help.html 同一套视觉语言）。
  由 public/_worker.js 在检测到 soft-404（缺失路径被 env.ASSETS.fetch 回退成 index.html）时返回：
  状态码 404。视觉与站点其余页面一致（复用同一套内联配色变量）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面未找到 · KaiBoard</title>
<meta name="description" content="抱歉，你访问的页面不存在或已被移动。">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://kaiboard.kaibuddy.com/404.html">
<style>
  :root{
    --bg:#ffffff; --fg:#1e1e1e; --muted:#495057; --line:#e9ecef;
    --accent:#1971c2; --accent-bg:#e7f5ff; --code-bg:#f8f9fa;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121212; --fg:#e9ecef; --muted:#adb5bd; --line:#2b2b2b;
           --accent:#4dabf7; --accent-bg:#10243a; --code-bg:#1b1b1b; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:820px;margin:0 auto;padding:64px 22px 80px;min-height:100vh;
    display:flex;flex-direction:column;justify-content:center}
  .code{font-size:64px;font-weight:700;line-height:1;margin:0 0 14px;color:var(--accent);letter-spacing:2px}
  h1{font-size:28px;margin:0 0 12px}
  p{color:var(--muted);margin:0 0 8px}
  .note{background:var(--accent-bg);border-left:3px solid var(--accent);
    padding:12px 16px;border-radius:0 8px 8px 0;margin:22px 0;color:var(--fg)}
  .cta{margin-top:10px}
  .cta a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
    padding:10px 20px;border-radius:8px;font-size:15px;margin-right:10px}
  .cta a.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  footer{margin-top:52px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
  footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">

  <p class="code">404</p>
  <h1>页面未找到</h1>
  <p>你访问的地址不存在，或内容已被移动。</p>

  <div class="note">
    如果你是从某个旧链接进来的，可能是地址已经变了。<br>
    回到画板继续用就好 —— 你的数据一直都在你自己的设备上，不受影响。
  </div>

  <div class="cta">
    <a href="/">回到 KaiBoard</a>
    <a class="ghost" href="/help">帮助与指南</a>
  </div>

  <footer>
    <p>
      <a href="https://kaiboard.kaibuddy.com">KaiBoard</a> ·
      <a href="https://github.com/ChasenKai/KaiBoard">GitHub</a> ·
      <a href="https://kaibuddy.com">kaibuddy.com</a>
    </p>
    <p>免费开源（MIT）· 绘图内核来自 <a href="https://github.com/excalidraw/excalidraw">Excalidraw</a>。数据只留在你自己的设备上。</p>
  </footer>

</div>
</body>
</html>
